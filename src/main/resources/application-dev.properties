spring.config.import=optional:file:.env[.properties]

# Local MySQL development profile. Activate explicitly with SPRING_PROFILES_ACTIVE=dev.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:${MYSQL_DATABASE:chatmvp}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:${MYSQL_USER:chatmvp}}
spring.datasource.password=${DB_PASS:${MYSQL_PASSWORD:chatmvp}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
